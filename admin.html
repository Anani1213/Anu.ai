<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin — Anu AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0E12;color:#F3F4F6;font-family:'Inter',sans-serif;padding:16px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-size:20px;font-weight:800}
.badge{background:linear-gradient(135deg,#00F2FE,#00FFC6);color:#04121A;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:800}
.tabs{display:flex;gap:6px;background:#16181E;padding:4px;border-radius:12px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:none;background:transparent;color:#9CA3AF;font-weight:600;font-size:13px;border-radius:9px;cursor:pointer;font-family:inherit}
.tab.active{background:#1C1F27;color:#F3F4F6}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#16181E;border:1px solid #2A2D37;border-radius:14px;padding:14px}
.stat-val{font-size:22px;font-weight:800;color:#00F2FE}
.stat-label{font-size:11px;color:#7C8393;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#16181E;border:1px solid #2A2D37;border-radius:14px;padding:14px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.item-name{font-weight:700;font-size:14px}
.item-id{font-size:11px;color:#7C8393;font-family:monospace}
.item-meta{font-size:12px;color:#9CA3AF;margin-bottom:8px}
.item-actions{display:flex;gap:6px}
.btn{padding:7px 12px;border-radius:9px;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#00F2FE,#00FFC6);color:#04121A}
.btn-reject{background:rgba(255,107,129,.15);color:#FF8296;border:1px solid rgba(255,107,129,.3)}
.btn-small{padding:5px 10px;font-size:11px}
.btn-pause{background:rgba(255,193,7,.15);color:#FFC107;border:1px solid rgba(255,193,7,.3)}
.btn-resume{background:rgba(0,255,198,.15);color:#00FFC6;border:1px solid rgba(0,255,198,.3)}
.empty{text-align:center;padding:40px;color:#7C8393;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="title">👑 Admin Panel</div>
  <div class="badge">v23.0</div>
</div>

<div class="stat-grid">
  <div class="stat"><div class="stat-val" id="statClients">-</div><div class="stat-label">Total Clients</div></div>
  <div class="stat"><div class="stat-val" id="statPending">-</div><div class="stat-label">Pending</div></div>
  <div class="stat"><div class="stat-val" id="statActive">-</div><div class="stat-label">Active</div></div>
  <div class="stat"><div class="stat-val" id="statRevenue">-</div><div class="stat-label">Monthly ብር</div></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="pending">⏳ Pending</button>
  <button class="tab" data-tab="clients">👥 Clients</button>
</div>

<div id="pendingList" class="list"></div>
<div id="clientsList" class="list hidden"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API = '/api/webapp-api';
const chatId = tg?.initDataUnsafe?.user?.id;
const $ = id => document.getElementById(id);

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    $('pendingList').classList.toggle('hidden', tab !== 'pending');
    $('clientsList').classList.toggle('hidden', tab !== 'clients');
  });
});

async function loadPending() {
  try {
    const r = await fetch(`${API}?action=pending&chatId=${chatId}`);
    const data = await r.json();
    if (!data.ok) return;
    $('statPending').textContent = data.items.length;

    if (!data.items.length) {
      $('pendingList').innerHTML = '<div class="empty">✅ No pending registrations</div>';
      return;
    }

    $('pendingList').innerHTML = data.items.map(item => `
      <div class="item">
        <div class="item-head">
          <div class="item-name">${item.name || 'Unknown'}</div>
          <div class="item-id">${item.id}</div>
        </div>
        <div class="item-meta">
          📱 ${item.phone || '-'}<br>
          🏢 ${item.businessName || '-'}<br>
          💬 ${(item.purpose || '-').slice(0, 80)}
        </div>
        <div class="item-actions">
          <button class="btn btn-approve btn-small" onclick="approve('${item.id}')">✅ Approve</button>
          <button class="btn btn-reject btn-small" onclick="reject('${item.id}')">❌ Reject</button>
        </div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

async function loadClients() {
  try {
    const r = await fetch(`${API}?action=clients&chatId=${chatId}`);
    const data = await r.json();
    if (!data.ok) return;
    $('statClients').textContent = data.items.length;

    const active = data.items.filter(c => c.status === 'active' || c.status === 'trial').length;
    $('statActive').textContent = active;

    let revenue = 0;
    data.items.forEach(c => {
      if (c.status !== 'active') return;
      if (c.plan === 'starter') revenue += 500;
      if (c.plan === 'pro') revenue += 1500;
      if (c.plan === 'business') revenue += 3500;
    });
    $('statRevenue').textContent = revenue.toLocaleString();

    if (!data.items.length) {
      $('clientsList').innerHTML = '<div class="empty">No clients yet</div>';
      return;
    }

    $('clientsList').innerHTML = data.items.map(c => {
      const icon = c.status === 'active' ? '🟢' : c.status === 'trial' ? '🎁' : c.status === 'paused' ? '⏸️' : '❌';
      return `
        <div class="item">
          <div class="item-head">
            <div class="item-name">${icon} ${c.name || 'Unknown'}</div>
            <div class="item-id">${c.id}</div>
          </div>
          <div class="item-meta">
            🏢 ${c.businessName || '-'}<br>
            📊 ${c.plan || 'free'} · ${c.messagesUsed || 0}/${c.messagesLimit || 500} msgs
          </div>
          <div class="item-actions">
            ${c.status === 'paused'
              ? `<button class="btn btn-resume btn-small" onclick="resume('${c.id}')">▶️ Resume</button>`
              : `<button class="btn btn-pause btn-small" onclick="pause('${c.id}')">⏸️ Pause</button>`}
          </div>
        </div>
      `;
    }).join('');
  } catch(e) { console.error(e); }
}

async function approve(id) {
  if (!confirm('Approve this client?')) return;
  // Send command via Telegram bot (opens chat)
  tg?.sendData?.('approve:' + id) || alert('Send /approve ' + id + ' to the bot');
}

async function reject(id) {
  if (!confirm('Reject this client?')) return;
  tg?.sendData?.('reject:' + id) || alert('Send /reject ' + id + ' to the bot');
}

function pause(id) {
  tg?.sendData?.('pause:' + id) || alert('Send /pause ' + id + ' to the bot');
}

function resume(id) {
  tg?.sendData?.('resume:' + id) || alert('Send /resume ' + id + ' to the bot');
}

loadPending();
loadClients();
</script>
</body>
</html>
